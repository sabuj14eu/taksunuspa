{# Three steps, because a travelling spa is unfamiliar: guests want to know
   what actually happens between pressing "book" and lying on the table. #}
<section class="section {{ hiw_tone | default('section-sand') }}" id="how-it-works">
  <div class="wrap">
    <div class="section-head center">
      <span class="eyebrow center-rules">{{ t.we_come_to_you }}</span>
      <h2>{{ t.how_it_works }}</h2>
    </div>
    <div class="grid grid-3 steps">
      {% for title, text in how_it_works %}
      <div class="step">
        <span class="step-no">{{ loop.index }}</span>
        <h3>{{ title }}</h3>
        <p class="muted">{{ text }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
