{% extends "admin/layout.html" %}
{% block content %}
<h1>New booking</h1>
<p class="muted">For a booking taken by phone or WhatsApp. It behaves exactly
  like one made on the website — the guest gets a code, and it appears in the
  calendar and the accounts.</p>

<div class="panel">
  <form method="post" class="gridform">
    <label class="wide">Treatment *
      <select name="treatment_id" id="treatment" required
              onchange="showDurations(this.value)">
        <option value="">— choose —</option>
        {% for tr in treatments %}
          <option value="{{ tr.id }}">{{ tr.name_en }}{% if tr.per_person %} (per person){% endif %}</option>
        {% endfor %}
      </select>
    </label>

    <label class="wide">Duration
      <select name="option_id" id="option">
        <option value="">Use the treatment's base duration</option>
        {% for tr in treatments %}
          {% for o in tr.active_options %}
            <option value="{{ o.id }}" data-treatment="{{ tr.id }}" hidden>
              {{ o.duration_min }} min — {{ rp(o.price_idr) }}
            </option>
          {% endfor %}
        {% endfor %}
      </select>
    </label>

    <label>Date *<input type="date" name="day" required value="{{ today.isoformat() }}"></label>
    <label>Start time *<input type="time" name="time" required step="300"></label>

    <label>Therapist
      <select name="therapist_id">
        <option value="">Any / not assigned</option>
        {% for th in therapists %}<option value="{{ th.id }}">{{ th.name }}</option>{% endfor %}
      </select>
    </label>
    <label>Guests<input type="number" name="guests" value="1" min="1" max="10"></label>

    <label>Guest name<input type="text" name="name" maxlength="80"></label>
    <label>Phone *<input type="tel" name="phone" required maxlength="30" placeholder="+62 ..."></label>
    <label>E-mail<input type="email" name="email" maxlength="120"></label>

    <label>Area
      <select name="area_id">
        <option value="">—</option>
        {% for a in areas %}
          <option value="{{ a.id }}">{{ a.name }}{% if a.travel_fee_idr %} — {{ rp(a.travel_fee_idr) }}{% endif %}</option>
        {% endfor %}
      </select>
    </label>

    <label class="wide">Address the therapist goes to
      <textarea name="service_address" rows="2" maxlength="400"
                placeholder="Villa or hotel name, room number, address"></textarea>
    </label>
    <label class="wide">Notes<textarea name="note" rows="2" maxlength="400"></textarea></label>

    <label>Payment
      <select name="payment_method">
        <option value="cash">Cash to the therapist</option>
        <option value="transfer">Bank transfer</option>
        <option value="online">Online payment</option>
      </select>
    </label>
    <label>Status
      <select name="status">
        {% for s in statuses %}<option value="{{ s }}" {{ 'selected' if s == 'confirmed' }}>{{ s }}</option>{% endfor %}
      </select>
    </label>

    <label class="check"><input type="checkbox" name="mark_paid"> Already paid</label>
    <label class="check"><input type="checkbox" name="force" checked>
      Book anyway, even if that time is taken or in the past</label>

    <div class="wide">
      <button class="btn btn-primary" type="submit">Create booking</button>
      <a class="btn btn-ghost" href="/admin/bookings">Cancel</a>
    </div>
  </form>
</div>

<script>
// Only show the durations belonging to the chosen treatment.
function showDurations(id){
  var sel = document.getElementById('option');
  sel.value = '';
  Array.prototype.forEach.call(sel.options, function(o){
    if (!o.dataset.treatment) return;
    o.hidden = o.dataset.treatment !== id;
  });
}
</script>
{% endblock %}
