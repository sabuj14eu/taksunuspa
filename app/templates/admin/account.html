{% extends "admin/layout.html" %}
{% block content %}
<h1>My account</h1>

<div class="panel">
  <h2>Change password</h2>
  <form method="post" class="stackform">
    <label>New password (at least 8 characters)<input type="password" name="password" required minlength="8"></label>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</div>

<div class="panel">
  <h2>Users</h2>
  <table class="table">
    <thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Active</th></tr></thead>
    <tbody>
    {% for u in users %}
      <tr><td>{{ u.name }}</td><td>{{ u.phone }}</td><td>{{ u.role }}</td><td>{{ '✅' if u.is_active_flag else '—' }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
