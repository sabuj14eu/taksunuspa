{% extends "admin/layout.html" %}
{% block content %}
<h1>My account</h1>

<div class="panel">
  <h2>Change password</h2>
  <form method="post" class="stackform">
    <label>New password (at least 8 characters)<input type="password" name="password" required minlength="8"></label>
    <button class="btn btn-primary" type="submit">Change password</button>
  </form>
</div>

<div class="panel">
  <h2>You</h2>
  <p>{{ current_user.name }} · {{ current_user.phone }}<br>
    <span class="muted small">Role: {{ current_user.role }}</span></p>
  {% if can('admin.users') %}
    <a class="btn btn-outline btn-sm" href="/admin/users">Manage staff accounts</a>
  {% endif %}
</div>
{% endblock %}
